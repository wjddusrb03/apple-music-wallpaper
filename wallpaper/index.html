<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Music Wallpaper</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', sans-serif;
    background: #080810;
    user-select: none;
    pointer-events: none;
  }

  /* ── Background ── */
  .bg-layer {
    position: fixed;
    inset: -250px;
    background-size: cover;
    background-position: center;
    filter: blur(110px) brightness(0.45) saturate(2.6);
    z-index: 0;
    transition: opacity 1.6s ease;
    contain: strict;
    transform: translateZ(0);
  }
  #bg-b { opacity: 0; }

  #vignette {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 75% 75% at 50% 50%, transparent 35%, rgba(0,0,0,0.42) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.28) 100%);
    z-index: 1;
  }

  #grain {
    position: fixed; inset: 0;
    z-index: 2;
    opacity: 0.035;
    background-repeat: repeat;
    background-size: 180px 180px;
  }

  /* ── Player Card ── */
  #player {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  #glass-card {
    display: flex; flex-direction: column; align-items: center;
    padding: 44px 52px 40px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 32px;
    box-shadow:
      0 24px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.14);
    contain: layout style;
    transform: translateZ(0);
  }

  /* ── Album Art ── */
  #art-wrap { position: relative; margin-bottom: 32px; }

  #art-glow {
    position: absolute;
    inset: -28px;
    background-size: cover;
    background-position: center;
    filter: blur(30px) brightness(0.6) saturate(2.5);
    border-radius: 50%;
    z-index: -1;
    opacity: 0;
    transition: opacity 1.2s ease;
    transform: translateZ(0);
  }

  #album-art {
    width: 320px; height: 320px;
    border-radius: 20px;
    object-fit: cover;
    image-rendering: high-quality;
    display: block;
    box-shadow:
      0 32px 80px rgba(0,0,0,0.75),
      0 0 0 1px rgba(255,255,255,0.12);
    transition: opacity 0.3s ease, transform 0.7s cubic-bezier(0.34,1.4,0.64,1);
    background: #1a1a2a;
    transform: translateZ(0);
  }
  #album-art.changing { opacity: 0; transform: scale(0.93) translateZ(0); }

  @keyframes art-glow-pulse {
    0%,100% { box-shadow: 0 32px 80px rgba(0,0,0,0.75), 0 0 0   1px rgba(255,255,255,0.12); }
    50%      { box-shadow: 0 32px 80px rgba(0,0,0,0.75), 0 0 60px 1px rgba(255,255,255,0.10); }
  }
  #album-art.playing {
    transform: scale(1.03) translateZ(0);
    animation: art-glow-pulse 4s ease-in-out infinite;
  }

  /* ── Song Info ── */
  #song-info { text-align: center; max-width: 440px; margin-bottom: 20px; }

  #title {
    font-size: 24px; font-weight: 700;
    color: #fff; letter-spacing: -0.3px;
    margin-bottom: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 16px rgba(0,0,0,0.7);
  }
  #artist {
    font-size: 15px; font-weight: 500;
    color: rgba(255,255,255,0.52);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── Progress Bar ── */
  #progress-wrapper { width: 400px; }
  #progress-track {
    width: 100%; height: 4px;
    background: rgba(255,255,255,0.14);
    border-radius: 4px;
    position: relative;
  }
  #progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: rgba(255,255,255,0.85);
    border-radius: 4px; width: 0%;
  }
  #times {
    display: flex; justify-content: space-between;
    margin-top: 7px;
    font-size: 11px; font-weight: 500;
    color: rgba(255,255,255,0.33);
  }
</style>
</head>
<body>

<div id="bg-a" class="bg-layer"></div>
<div id="bg-b" class="bg-layer"></div>
<div id="vignette"></div>
<div id="grain"></div>

<div id="player">
  <div id="glass-card">
    <div id="art-wrap">
      <div id="art-glow"></div>
      <img id="album-art" src="" alt="">
    </div>
    <div id="song-info">
      <div id="title">Apple Music을 재생하세요</div>
      <div id="artist">—</div>
    </div>
    <div id="progress-wrapper">
      <div id="progress-track"><div id="progress-fill"></div></div>
      <div id="times"><span id="current-time">0:00</span><span id="total-time">0:00</span></div>
    </div>
  </div>
</div>

<script>
/* ── DOM Cache ── */
const $title   = document.getElementById('title');
const $artist  = document.getElementById('artist');
const $art     = document.getElementById('album-art');
const $glow    = document.getElementById('art-glow');
const $fill    = document.getElementById('progress-fill');
const $curTime = document.getElementById('current-time');
const $totTime = document.getElementById('total-time');

let lastArt = '', activeBg = 'a';
let serverPos = 0, serverDur = 0, serverTime = 0, isPlaying = false;

/* ── Time Format ── */
function fmt(s) {
  if (!s || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* ── Smooth Progress (rAF interpolation) ── */
function getCurrentPos() {
  if (!isPlaying) return serverPos;
  return serverPos + (performance.now() - serverTime) / 1000;
}

function rafLoop() {
  const pos = Math.min(getCurrentPos(), serverDur);
  const pct = serverDur > 0 ? (pos / serverDur) * 100 : 0;
  $fill.style.width = pct + '%';
  $curTime.textContent = fmt(pos);
  $totTime.textContent = fmt(serverDur);
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);

/* ── Film Grain (once) ── */
(function() {
  const c = document.createElement('canvas');
  c.width = 150; c.height = 150;
  const ctx = c.getContext('2d');
  const d = ctx.createImageData(150, 150);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = Math.random() * 255 | 0;
    d.data[i] = d.data[i+1] = d.data[i+2] = v;
    d.data[i+3] = 255;
  }
  ctx.putImageData(d, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* ── Background Crossfade ── */
function swapBg(url) {
  const next = activeBg === 'a' ? 'b' : 'a';
  document.getElementById('bg-' + next).style.backgroundImage = `url('${url}')`;
  document.getElementById('bg-' + next).style.opacity = '1';
  document.getElementById('bg-' + activeBg).style.opacity = '0';
  activeBg = next;
  $glow.style.backgroundImage = `url('${url}')`;
  $glow.style.opacity = '0.85';
}

/* ── Receive data from Python (pywebview evaluate_js) ── */
function handleMsg(data) {
  if (data.album_art !== undefined && data.album_art !== lastArt) {
    lastArt = data.album_art;
    $art.classList.add('changing');
    setTimeout(() => {
      if (data.album_art) { $art.src = data.album_art; swapBg(data.album_art); }
      $art.classList.remove('changing');
    }, 300);
  }
  if (data.title  !== undefined) $title.textContent  = data.title  || 'Apple Music을 재생하세요';
  if (data.artist !== undefined) $artist.textContent = data.artist || '\u2014';

  if (data.position !== undefined) { serverPos = data.position; serverTime = performance.now(); }
  if (data.duration !== undefined) { serverDur = data.duration; }
  if (data.is_playing !== undefined) {
    isPlaying = data.is_playing;
    data.is_playing ? $art.classList.add('playing') : $art.classList.remove('playing');
  }
}
</script>
</body>
</html>
